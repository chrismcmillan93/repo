<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Life</title>
<script>
  // Apply a saved light/dark choice before first paint (see js/theme.js).
  try { var t = localStorage.getItem('life-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<section id="auth" class="auth" hidden>
  <div class="panel">
    <h1>Life</h1>
    <p class="hint">Goals, to-dos, training, food and everything else in one place. Sign in with the same email you use for Goals and Fitness.</p>
    <form id="emailForm" class="add"><input class="field" id="email" type="email" required autocomplete="email" placeholder="you@example.com" aria-label="Email"><button class="btn pri">Send sign-in link</button></form>
    <form id="codeForm" class="add" hidden><input class="field" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="6-digit code" aria-label="6-digit code"><button class="btn">Sign in</button></form>
    <p id="authMsg" class="hint" aria-live="polite"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="brand"><b>Life</b><span id="date"></span>
      <span class="tools"><button class="btn sm" id="themeBtn" type="button">Theme</button><button class="btn sm" id="signOut" type="button">Sign out</button></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div><p id="offline" class="offline" hidden>Offline: showing your last saved data. Changes won't save until you're back online.</p></header>
  <div class="wrap"><main id="main"></main></div>
</div>
<div id="toast-host" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
