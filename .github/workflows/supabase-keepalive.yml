# Keeps both free-tier Supabase projects from being auto-paused for inactivity.
# Supabase counts API traffic, not queries run inside the database, so this makes
# real REST requests from outside. Backed up by a daily pg_net self-ping cron job in
# each project (see the *_keepalive_daily_rest_ping migrations).
# The keys are the public anon/publishable keys already shipped in the site's JS.
name: Supabase keep-alive

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: dashboards-new (usa, goals, thailand, fitness, ...)
        run: |
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            'https://bcrmbuiuekklpocpllpw.supabase.co/rest/v1/checkbox_states?select=id&limit=1' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjcm1idWl1ZWtrbHBvY3BsbHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNjk1NzcsImV4cCI6MjEwMDc0NTU3N30.T4HIbLeAEtPVhV4JKz5HaxEJWqT_5FqdDqT7PJU2YTM'
      - name: walking-up-hills (wainwrights)
        if: always()
        run: |
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            'https://jyxtduvkmztexwurrjsf.supabase.co/rest/v1/fell_heights?select=item_id&limit=1' \
            -H 'apikey: sb_publishable_KY9uqIN4zqY0WYmDJoCe3A_dr-YwArX'
