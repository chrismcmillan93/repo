  var URGENCY_RANK = { high: 0, medium: 1, low: 2 };
  var URGENCY_COLOR = { high: '#F0654A', medium: '#E8A33D', low: '#6FBF8C' };

  var state = {
    items: seedItems(),
    bookings: seedBookings(),
    airbnbs: seedAirbnbs(),
    expandedLocations: { bkk1: true },
    bookingsOpen: true,
    airbnbsOpen: true,
    editOpen: {},
    drafts: {}
  };
  var hasLoaded = false;
  var saveTimer = null;

  function scheduleSave() {
    if (!hasLoaded || !window.storage) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      window.storage.set(STORAGE_KEY, JSON.stringify({ items: state.items, bookings: state.bookings, airbnbs: state.airbnbs })).catch(function () {});
    }, 400);
  }

  function loadState() {
    if (!window.storage) { hasLoaded = true; renderAll(); return; }
    window.storage.get(STORAGE_KEY).then(function (res) {
      if (res && res.value) {
        var parsed = JSON.parse(res.value);
        if (Array.isArray(parsed.items)) state.items = parsed.items;
        if (Array.isArray(parsed.bookings)) state.bookings = parsed.bookings;
        if (Array.isArray(parsed.airbnbs)) state.airbnbs = parsed.airbnbs;
      }
    }).catch(function () {
      // nothing saved yet — keep the seeded plan
    }).then(function () {
      // Migration: return flight date is now confirmed (27 Nov), patch this in
      // even if an earlier session already saved it as unresolved.
      state.bookings = state.bookings.map(function (b) {
        return b.id === 'bk1'
          ? Object.assign({}, b, { done: true, deadline: 'Confirmed ✓', notes: 'Fri 27 Nov 2026, 18:55 BKK departure' })
          : b;
      });
      // Migration: Bangkok accommodation price + who booked it, now known,
      // patched in even if an earlier session already saved it without this.
      state.airbnbs = state.airbnbs.map(function (a) {
        return a.id === 'ab-bkk' && a.priceGbp == null
          ? Object.assign({}, a, {
              priceGbp: 115.15, priceThb: 5182, bookedBy: a.bookedBy || 'Christopher',
              note: 'Total £345.45 for 3 nights, split 3 ways (£201.12 paid 1 Jul, £144.33 due 29 Oct) — pay Christopher your share.'
            })
          : a;
      });
      hasLoaded = true;
      renderAll();
    });
  }

  // ---------- mutations ----------
  function toggleItem(id) {
    var it = state.items.find(function (i) { return i.id === id; });
    if (it) { it.checked = !it.checked; renderAll(); scheduleSave(); }
  }
  function deleteItem(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    renderAll(); scheduleSave();
  }
  function moveItem(id, dir) {
    var item = state.items.find(function (i) { return i.id === id; });
    if (!item) return;
    var siblings = state.items.filter(function (i) { return i.location === item.location; })
      .sort(function (a, b) { return a.order - b.order; });
    var idx = siblings.findIndex(function (i) { return i.id === id; });
    var swapIdx = dir === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= siblings.length) return;
    var swap = siblings[swapIdx];
    var tmp = item.order; item.order = swap.order; swap.order = tmp;
    renderAll(); scheduleSave();
  }
  function addItem(location) {
    var draft = state.drafts[location] || { title: '', cost: '', place: '' };
    if (!draft.title || !draft.title.trim()) return;
    var siblings = state.items.filter(function (i) { return i.location === location; });
    var maxOrder = siblings.length ? Math.max.apply(null, siblings.map(function (i) { return i.order; })) : -1;
    state.items.push({
      id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      location: location, order: maxOrder + 1, category: 'Other',
      title: draft.title.trim(),
      cost: draft.cost ? (parseFloat(draft.cost) || 0) : 0,
      thb: null, notes: '', checked: false, description: '',
      place: draft.place ? draft.place.trim() : ''
    });
    state.drafts[location] = { title: '', cost: '', place: '' };
    renderAll(); scheduleSave();
  }
  function toggleBooking(id) {
    var b = state.bookings.find(function (x) { return x.id === id; });
    if (b) { b.done = !b.done; renderAll(); scheduleSave(); }
  }
  function toggleLocation(id) {
    state.expandedLocations[id] = !state.expandedLocations[id];
    renderAll();
  }
  function toggleEdit(id) {
    state.editOpen[id] = !state.editOpen[id];
    renderAll();
  }

              '<div style="flex:1;min-width:0;">' + body + '</div></div>' +
              '<div class="tp-item-actions">' +
              '<button class="tp-icon-btn" ' + (idx === 0 ? 'disabled' : '') + ' data-action="move-item" data-dir="up" data-id="' + item.id + '" aria-label="Move up">↑</button>' +
              '<button class="tp-icon-btn" ' + (idx === locItems.length - 1 ? 'disabled' : '') + ' data-action="move-item" data-dir="down" data-id="' + item.id + '" aria-label="Move down">↓</button>' +
              '<button class="tp-icon-btn" data-action="toggle-edit" data-id="' + item.id + '" aria-label="Edit item">✎</button>' +
              '<button class="tp-icon-btn" data-action="delete-item" data-id="' + item.id + '" aria-label="Delete item">🗑</button>' +
              '</div></div>';
          }).join('');

      var addRow = '<div class="tp-add-row">' +
        '<input class="tp-input tp-input-title" placeholder="Add your own item…" data-role="draft-title" data-location="' + loc.id + '" value="' + esc(draft.title) + '" />' +
        '<input class="tp-input tp-input-cost" placeholder="£pp" inputmode="decimal" data-role="draft-cost" data-location="' + loc.id + '" value="' + esc(draft.cost) + '" />' +
        '<input class="tp-input tp-input-place" placeholder="Location (for map link, optional)" data-role="draft-place" data-location="' + loc.id + '" value="' + esc(draft.place || '') + '" />' +
        '<button class="tp-btn-add" data-action="add-item" data-location="' + loc.id + '">+ Add</button>' +
        '</div>';

      return '<div class="tp-panel">' +
        '<button class="tp-panel-head" data-action="toggle-location" data-id="' + loc.id + '">' +
        '<div><div class="tp-panel-title"><span class="tp-leg-num">' + loc.leg + '</span> ' + esc(loc.name) + '</div>' +
        '<div class="tp-panel-sub">' + esc(loc.dates) + ' · <span class="tp-progress">' + checkedCount + '/' + locItems.length + ' added</span></div></div>' +
        '<span class="tp-chev ' + (open ? 'open' : '') + '">⌄</span>' +
        '</button>' +
        (open ? '<div class="tp-panel-body">' + itemsHtml + addRow + '</div>' : '') +
        '</div>';
    }).join('');
    document.getElementById('locationsPanel').innerHTML = html;
  }

  function renderAll() {
    renderBookings();
    renderAirbnbs();
    renderCostSummary();
    renderLocations();
  }

  // ---------- countdown ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function tickCountdown() {
    var diff = Math.max(0, new Date(FLIGHT.target).getTime() - Date.now());
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('cdDays').textContent = days;
    document.getElementById('cdHours').textContent = pad(hours);
    document.getElementById('cdMins').textContent = pad(mins);
    document.getElementById('cdSecs').textContent = pad(secs);
  }

  // ---------- events (delegated) ----------
  var app = document.getElementById('app');
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    if (action === 'toggle-item') toggleItem(id);
    else if (action === 'delete-item') deleteItem(id);
    else if (action === 'move-item') moveItem(id, el.dataset.dir);
    else if (action === 'toggle-edit') toggleEdit(id);
    else if (action === 'toggle-booking') toggleBooking(id);
    else if (action === 'toggle-location') toggleLocation(id);
    else if (action === 'toggle-bookings') { state.bookingsOpen = !state.bookingsOpen; renderAll(); }
    else if (action === 'toggle-airbnbs') { state.airbnbsOpen = !state.airbnbsOpen; renderAll(); }
    else if (action === 'add-item') addItem(el.dataset.location);
  });

  function findItem(id) { return state.items.find(function (i) { return i.id === id; }); }
  function findAirbnb(id) { return state.airbnbs.find(function (a) { return a.id === id; }); }
  function draftFor(loc) { return state.drafts[loc] || { title: '', cost: '', place: '' }; }

  // input events are NOT re-rendered immediately, so typing never loses focus
  app.addEventListener('input', function (e) {
    var el = e.target, role = el.dataset.role, it, ab;
    if (role === 'draft-title') {
      state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { title: el.value });
    } else if (role === 'draft-cost') {
      state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { cost: el.value });
    } else if (role === 'draft-place') {
      state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { place: el.value });
    } else if (role === 'edit-title') {
      it = findItem(el.dataset.id); if (it) { it.title = el.value; scheduleSave(); }
    } else if (role === 'edit-cost') {
      it = findItem(el.dataset.id); if (it) { it.cost = el.value === '' ? 0 : (parseFloat(el.value) || 0); scheduleSave(); }
    } else if (role === 'edit-thb') {
      it = findItem(el.dataset.id); if (it) { it.thb = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleSave(); }
    } else if (role === 'edit-place') {
      it = findItem(el.dataset.id); if (it) { it.place = el.value; scheduleSave(); }
    } else if (role === 'edit-desc') {
      it = findItem(el.dataset.id); if (it) { it.description = el.value; scheduleSave(); }
    } else if (role === 'edit-notes') {
      it = findItem(el.dataset.id); if (it) { it.notes = el.value; scheduleSave(); }
    } else if (role === 'ab-price-gbp') {
      ab = findAirbnb(el.dataset.id); if (ab) { ab.priceGbp = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleSave(); }
    } else if (role === 'ab-price-thb') {
      ab = findAirbnb(el.dataset.id); if (ab) { ab.priceThb = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleSave(); }
    } else if (role === 'ab-bookedby') {
      ab = findAirbnb(el.dataset.id); if (ab) { ab.bookedBy = el.value; scheduleSave(); }
    } else if (role === 'ab-note') {
      ab = findAirbnb(el.dataset.id); if (ab) { ab.note = el.value; scheduleSave(); }
    }
  });

  app.addEventListener('change', function (e) {
    var el = e.target, ab, it;
    if (el.dataset.role === 'edit-category') {
      it = findItem(el.dataset.id);
      if (it) { it.category = el.value; scheduleSave(); }
    } else if (el.dataset.role === 'ab-status') {
      ab = findAirbnb(el.dataset.id);
      if (ab) { ab.status = el.value; scheduleSave(); renderAirbnbs(); }
    }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.dataset.role && e.target.dataset.role.indexOf('draft-') === 0 && e.target.tagName !== 'TEXTAREA') {
      addItem(e.target.dataset.location);
    }
  });

  renderFlightCard();
  tickCountdown();
  setInterval(tickCountdown, 1000);
  loadState();
})();
</script>
</body>
</html>
