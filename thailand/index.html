  function sbHeaders(extra) {
    var h = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function sbErr(prefix, r, bodyText) {
    var msg = prefix + ' failed (HTTP ' + r.status + (r.statusText ? ' ' + r.statusText : '') + ')';
    if (bodyText) msg += ': ' + bodyText.slice(0, 200);
    return new Error(msg);
  }
  function sbGet(table, qs) {
    return fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + qs, { headers: sbHeaders() })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw sbErr(table + ' GET', r, t); });
        return r.json();
      });
  }
  // item_data is a brand-new table we control, so a real upsert (on_conflict) is safe.
  function sbUpsertItemData(rows) {
    if (!rows.length) return Promise.resolve();
    return fetch(SUPABASE_URL + '/rest/v1/item_data?on_conflict=dashboard_id,item_id,field', {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(rows)
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw sbErr('item_data upsert', r, t); });
    });
  }
  // checkbox_states is pre-existing and shared with another dashboard — we don't
  // add constraints to it, so instead of a DB upsert we PATCH a matching row if
  // one exists, and INSERT only if it doesn't.
  function sbSetCheck(itemId, isChecked) {
    var filter = 'dashboard_id=eq.' + encodeURIComponent(DASHBOARD_ID) + '&item_id=eq.' + encodeURIComponent(itemId);
    return fetch(SUPABASE_URL + '/rest/v1/checkbox_states?' + filter, {
      method: 'PATCH',
      headers: sbHeaders({ 'Prefer': 'return=representation' }),
      body: JSON.stringify({ is_checked: isChecked })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw sbErr('checkbox_states PATCH', r, t); });
      return r.json();
    }).then(function (rows) {
      if (rows && rows.length > 0) return; // updated an existing row
      return fetch(SUPABASE_URL + '/rest/v1/checkbox_states', {
        method: 'POST',
        headers: sbHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify([{ dashboard_id: DASHBOARD_ID, item_id: itemId, is_checked: isChecked }])
      }).then(function (r2) {
        if (!r2.ok) return r2.text().then(function (t) { throw sbErr('checkbox_states POST', r2, t); });
      });
    });

  }

    },
    target: '2026-11-12T14:05:00Z'
  };

  var LOCATIONS = [
    { id: 'bkk1', leg: '01', name: 'Bangkok', dates: '13–16 Nov' },
    { id: 'krabi', leg: '02', name: 'Krabi', dates: '16–18 Nov' },
    { id: 'phuket', leg: '03', name: 'Phuket', dates: '18–22 Nov' },

    { id: 'bkk2', leg: '05', name: 'Bangkok (return)', dates: '26–27 Nov' }
  ];

  var PARTY = {

    phuket: ['Chris', 'Andrew', 'Craig', 'Dalz'], kpg: ['Chris', 'Andrew', 'Craig', 'Dalz'],

  };

  // ITEM_FIELDS: which item_data fields to sync for a location-item (used on create/read).
  var ITEM_FIELDS = ['title', 'category', 'cost', 'thb', 'notes', 'description', 'place', 'rating', 'ratingCount', 'tags', 'order', 'location', 'day'];

        host: '3-bed villa, booked by Andrew', address: 'Moo 5, Sai Thai, Krabi (~8 min from Ao Nang)',
        checkin: 'Mon 16 Nov', checkout: 'Wed 18 Nov',
        totalGbp: 271, totalThb: null, bookedBy: 'Andrew', paid: { Andrew: true }, partyOverride: ['Chris', 'Andrew', 'Craig'],

      { id: 'ab-phuket-chris', location: 'Phuket', locKey: 'phuket', name: 'Hotel Indigo Phuket Patong', status: 'confirmed',
        host: "Chris's solo room", address: 'Rat U Thit 200 Pee Rd, Patong, Phuket 83150',
        checkin: 'Wed 18 Nov · 15:00', checkout: 'Sun 22 Nov · 12:00',

  function mapUrlForItem(item) {
    if (item.placeId) {
      var q = encodeURIComponent(item.title || item.place || 'place');
      return 'https://www.google.com/maps/search/?api=1&query=' + q + '&query_place_id=' + item.placeId;
    }
    return mapUrlByText(item.place);
  }
  function reviewsUrlForItem(item) { return item.placeId ? ('https://search.google.com/local/reviews?placeid=' + item.placeId) : null; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtGBP(n) { return '£' + Number(n).toFixed(2); }
  function fmtTHBNum(n) { return Math.round(n).toLocaleString('en-GB'); }
  function fmtCount(n) { if (n == null) return ''; if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k'; return String(n); }
  function thbFor(item) { return item.thb != null ? item.thb : Math.round((item.cost * THB_RATE) / 10) * 10; }
  function isThbApprox(item) { return item.thb == null; }
  function costLine(item) {
    if (!item.cost || item.cost <= 0) return 'Free';
    return fmtGBP(item.cost) + 'pp · ' + (isThbApprox(item) ? '≈' : '') + '฿' + fmtTHBNum(thbFor(item)) + 'pp';
  }
  function tagsRowHtml(tags) {
    if (!tags || !tags.length) return '';
    return '<div class="tp-tags-row">' + tags.map(function (t) { return '<span class="tp-tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  }
  function ratingAndLinksHtml(item) {
    var parts = [];
    if (item.rating != null) parts.push('<span class="tp-rating">★ ' + item.rating.toFixed(1) + (item.ratingCount != null ? ' (' + fmtCount(item.ratingCount) + ')' : '') + '</span>');
    if (item.place || item.placeId) parts.push('<a class="tp-map-link" href="' + mapUrlForItem(item) + '" target="_blank" rel="noopener noreferrer">📍 Map</a>');
    var ru = reviewsUrlForItem(item);
    if (ru) parts.push('<a class="tp-reviews-link" href="' + ru + '" target="_blank" rel="noopener noreferrer">★ Reviews</a>');
    return parts.join('');

  var URGENCY_RANK = { high: 0, medium: 1, low: 2 };

  function useCountdownTick() {
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var diff = Math.max(0, new Date(FLIGHT.target).getTime() - Date.now());
      document.getElementById('cdDays').textContent = Math.floor(diff / 86400000);
      document.getElementById('cdHours').textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById('cdMins').textContent = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById('cdSecs').textContent = pad(Math.floor((diff % 60000) / 1000));
    }
    tick(); setInterval(tick, 1000);
  }

  var state = {
    items: seedItems(), bookings: seedBookings(), airbnbs: seedAirbnbs(),
    expandedLocations: { bkk1: true }, bookingsOpen: true, airbnbsOpen: true,
    editOpen: {}, drafts: {}, categoryFilter: {}
  };
  var hasLoaded = false;

  // ---------- load: fetch shared state and overlay it onto the local seed ----------
  function loadState() {
    clearLoadErrorBanner();
    Promise.all([
      sbGet('checkbox_states', 'dashboard_id=eq.' + DASHBOARD_ID + '&select=item_id,is_checked'),
      sbGet('item_data', 'dashboard_id=eq.' + DASHBOARD_ID + '&select=item_id,field,value')
    ]).then(function (results) {
      var checks = results[0], fields = results[1];
      var checkMap = {};
      checks.forEach(function (r) { checkMap[r.item_id] = r.is_checked; });
      var fieldMap = {};
      fields.forEach(function (r) {
        fieldMap[r.item_id] = fieldMap[r.item_id] || {};
        fieldMap[r.item_id][r.field] = r.value;
      });

      // Overlay onto seeded location-items, drop any soft-deleted ones
      state.items = seedItems().filter(function (i) {
        var f = fieldMap[i.id]; return !(f && f.deleted === true);
      }).map(function (i) {
        var f = fieldMap[i.id] || {};
        var merged = Object.assign({}, i, f);
        merged.checked = checkMap.hasOwnProperty(i.id) ? checkMap[i.id] : i.checked;
        return merged;
      });

      // Inject custom items that only exist remotely
      Object.keys(fieldMap).forEach(function (id) {
        if (id.indexOf('custom-') !== 0) return;
        if (state.items.some(function (i) { return i.id === id; })) return;
        var f = fieldMap[id];
        if (f.deleted === true) return;
        state.items.push({
          id: id, location: f.location || 'bkk1', order: f.order != null ? f.order : 999,
          category: f.category || 'Other', title: f.title || '(untitled)',
          cost: f.cost != null ? f.cost : 0, thb: f.thb != null ? f.thb : null,
          notes: f.notes || '', checked: checkMap.hasOwnProperty(id) ? checkMap[id] : false,
          description: f.description || '', place: f.place || '',
          rating: f.rating != null ? f.rating : null, ratingCount: f.ratingCount != null ? f.ratingCount : null,
          placeId: null, tags: f.tags || [], day: f.day || null
        });
      });

      // Bookings: overlay done state, who's claimed it, and per-person booked ticks (title/deadline/notes stay local)
      state.bookings = seedBookings().map(function (b) {
        var f = fieldMap[b.id] || {};
        var bookedPeople = {};
        (b.party || []).forEach(function (name) {
          var key = b.id + ':person:' + name;
          if (checkMap.hasOwnProperty(key)) bookedPeople[name] = checkMap[key];
        });
        return Object.assign({}, b, {
          done: checkMap.hasOwnProperty(b.id) ? checkMap[b.id] : b.done,
          bookedByName: f.bookedByName != null ? f.bookedByName : (b.bookedByName || ''),
          bookedPeople: Object.assign({}, b.bookedPeople, bookedPeople)
        });
      });

      // Airbnbs: overlay fields + per-person paid checkboxes
      state.airbnbs = seedAirbnbs().map(function (a) {
        var f = fieldMap[a.id] || {};
        var merged = Object.assign({}, a, f);
        var paid = {};
        (PARTY[a.locKey] || []).forEach(function (name) {
          var key = a.id + ':paid:' + name;
          if (checkMap.hasOwnProperty(key)) paid[name] = checkMap[key];
        });
        merged.paid = Object.assign({}, a.paid, paid);
        return merged;
      });

      hasLoaded = true;
      renderAll();
    }).catch(function (e) {
      console.error('Shared data load failed:', e);
      showLoadErrorBanner(e);
      hasLoaded = true;
      renderAll();
    });
  }

  // ---------- write helpers ----------
  var fieldTimers = {};
  function scheduleFieldWrite(itemId, field, value) {
    var key = itemId + '::' + field;
    clearTimeout(fieldTimers[key]);
    fieldTimers[key] = setTimeout(function () { writeField(itemId, field, value); }, 500);
  }
  function writeField(itemId, field, value) {
    sbUpsertItemData([{ dashboard_id: DASHBOARD_ID, item_id: itemId, field: field, value: value === undefined ? null : value, updated_at: new Date().toISOString() }])
      .catch(function (e) { console.error(e); flashSyncError(e); });
  }
  function writeFields(itemId, obj) {
    var rows = Object.keys(obj).map(function (f) {
      return { dashboard_id: DASHBOARD_ID, item_id: itemId, field: f, value: obj[f] === undefined ? null : obj[f], updated_at: new Date().toISOString() };
    });
    sbUpsertItemData(rows).catch(function (e) { console.error(e); flashSyncError(e); });
  }
  function writeCheck(itemId, val) {
    sbSetCheck(itemId, val).catch(function (e) { console.error(e); flashSyncError(e); });
  }

  // ---------- mutations ----------
  function findItem(id) { return state.items.find(function (i) { return i.id === id; }); }
  function findAirbnb(id) { return state.airbnbs.find(function (a) { return a.id === id; }); }
  function draftFor(loc) { return state.drafts[loc] || { title: '', cost: '', place: '' }; }

  function toggleItem(id) {
    var it = findItem(id); if (!it) return;
    it.checked = !it.checked; renderAll(); writeCheck(id, it.checked);
  }
  function deleteItem(id) {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    renderAll(); writeField(id, 'deleted', true);
  }
  function moveItem(id, dir) {
    var item = findItem(id); if (!item) return;
    var siblings = state.items.filter(function (i) { return i.location === item.location; }).sort(function (a, b) { return a.order - b.order; });
    var idx = siblings.findIndex(function (i) { return i.id === id; });
    var swapIdx = dir === 'up' ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= siblings.length) return;
    var swap = siblings[swapIdx];
    var tmp = item.order; item.order = swap.order; swap.order = tmp;
    renderAll();
    sbUpsertItemData([
      { dashboard_id: DASHBOARD_ID, item_id: item.id, field: 'order', value: item.order, updated_at: new Date().toISOString() },
      { dashboard_id: DASHBOARD_ID, item_id: swap.id, field: 'order', value: swap.order, updated_at: new Date().toISOString() }
    ]).catch(function (e) { console.error(e); flashSyncError(e); });
  }
  function addItem(location) {
    var draft = draftFor(location);
    if (!draft.title || !draft.title.trim()) return;
    var siblings = state.items.filter(function (i) { return i.location === location; });
    var maxOrder = siblings.length ? Math.max.apply(null, siblings.map(function (i) { return i.order; })) : -1;
    var newItem = {
      id: 'custom-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      location: location, order: maxOrder + 1, category: 'Other',
      title: draft.title.trim(), cost: draft.cost ? (parseFloat(draft.cost) || 0) : 0,
      thb: null, notes: '', checked: false, description: '',
      place: draft.place ? draft.place.trim() : '', rating: null, ratingCount: null, placeId: null, tags: []
    };
    state.items.push(newItem);
    state.drafts[location] = { title: '', cost: '', place: '' };
    renderAll();
    var toWrite = {};
    ITEM_FIELDS.forEach(function (f) { toWrite[f] = newItem[f]; });
    writeFields(newItem.id, toWrite);
  }
  function toggleBooking(id) {
    var b = state.bookings.find(function (x) { return x.id === id; });
    if (b) { b.done = !b.done; renderAll(); writeCheck(id, b.done); }
  }
  function togglePaid(airbnbId, name) {
    var ab = findAirbnb(airbnbId); if (!ab || name === ab.bookedBy) return;
    ab.paid = ab.paid || {};
    ab.paid[name] = !ab.paid[name];
    renderAll();
    writeCheck(airbnbId + ':paid:' + name, ab.paid[name]);
  }
  function toggleBkPerson(bookingId, name) {
    var b = state.bookings.find(function (x) { return x.id === bookingId; });
    if (!b) return;
    b.bookedPeople = b.bookedPeople || {};
    b.bookedPeople[name] = !b.bookedPeople[name];

    writeCheck(bookingId + ':person:' + name, b.bookedPeople[name]);
  }
  function toggleLocation(id) { state.expandedLocations[id] = !state.expandedLocations[id]; renderAll(); }
  function toggleEdit(id) { state.editOpen[id] = !state.editOpen[id]; renderAll(); }

  // ---------- render (unchanged visuals) ----------
  function renderFlightCard() {
    var o = FLIGHT.outbound, r = FLIGHT.returnLeg;
    document.getElementById('flightCard').innerHTML =
      '<div class="tp-flightrow"><div class="tp-flightroute">' + esc(o.route) + '</div><div class="tp-flightright">' + esc(o.conf) + '</div></div>' +
      '<div class="tp-flightmeta">' + esc(o.airline) + ' · ' + esc(o.when) + '</div>' +
      '<div class="tp-flightmeta">' + esc(o.detail) + '</div>' +
      '<div class="tp-flightdivider"></div>' +
      '<div class="tp-flightrow"><div class="tp-flightroute">' + esc(r.route) + '</div><div class="tp-flightright">' + esc(r.conf) + '</div></div>' +
      '<div class="tp-flightmeta">' + esc(r.airline) + ' · ' + esc(r.when) + '</div>' +
      '<div class="tp-flightmeta">' + esc(r.detail) + '</div>';

  function isBkPersonBooked(b, name) { return !!(b.bookedPeople && b.bookedPeople[name]); }

  function renderBookings() {
    var withDone = state.bookings.map(function (b) {
      var d = (b.party && b.party.length) ? b.party.every(function (n) { return isBkPersonBooked(b, n); }) : b.done;
      var copy = Object.assign({}, b); copy._done = d; return copy;
    });
    var bookedCount = withDone.filter(function (b) { return b._done; }).length;
    var sorted = withDone.slice().sort(function (a, b) {
      if (a._done !== b._done) return a._done ? 1 : -1;
      return URGENCY_RANK[a.urgency] - URGENCY_RANK[b.urgency];
    });
    var rows = sorted.map(function (b) {
      if (b.party && b.party.length) {
        var peopleRows = b.party.map(function (name) {
          var checked = isBkPersonBooked(b, name);
          return '<div class="tp-booking-row" style="padding:0.35rem 0;">' +
            '<button class="tp-check ' + (checked ? 'checked' : '') + '" data-action="toggle-bk-person" data-id="' + b.id + '" data-name="' + esc(name) + '" aria-label="Toggle booked">' + (checked ? '✓' : '') + '</button>' +
            '<div style="flex:1;"><span class="tp-item-title">' + esc(name) + '</span></div></div>';
        }).join('');
        return '<div class="tp-booking-row ' + (b._done ? 'done' : '') + '" style="align-items:flex-start;">' +
          '<div style="flex:1;min-width:0;">' +
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;">' +
          '<div class="tp-item-title">' + esc(b.title) + '</div>' +
          '<span class="tp-badge" style="background:' + URGENCY_COLOR[b.urgency] + ';flex-shrink:0;">' + esc(b.deadline) + '</span>' +
          '</div>' +
          (b.notes ? '<div class="tp-panel-sub">' + esc(b.notes) + '</div>' : '') +
          '<div style="margin-top:0.4rem;border-top:1px solid rgba(232,163,61,0.1);">' + peopleRows + '</div>' +
          '</div></div>';
      }
      return '<div class="tp-booking-row ' + (b._done ? 'done' : '') + '">' +
        '<button class="tp-check ' + (b._done ? 'checked' : '') + '" data-action="toggle-booking" data-id="' + b.id + '" aria-label="Toggle booked">' + (b._done ? '✓' : '') + '</button>' +
        '<div style="flex:1;min-width:0;"><div class="tp-item-title">' + esc(b.title) + '</div>' +
        (b.notes ? '<div class="tp-panel-sub">' + esc(b.notes) + '</div>' : '') +
        '<div style="display:flex;align-items:center;gap:0.4rem;margin-top:0.4rem;flex-wrap:wrap;">' +
        '<input class="tp-input tp-bk-name" placeholder="Booked by…" data-role="bk-name" data-id="' + b.id + '" value="' + esc(b.bookedByName || '') + '" />' +
        '<span class="tp-badge" style="background:' + URGENCY_COLOR[b.urgency] + '">' + esc(b.deadline) + '</span>' +
        '</div></div></div>';
    }).join('');
    document.getElementById('bookingsPanel').innerHTML =
      '<div class="tp-panel"><button class="tp-panel-head" data-action="toggle-bookings">' +
      '<div><div class="tp-panel-title">⚠ Needs booking</div><div class="tp-panel-sub">' + bookedCount + ' of ' + state.bookings.length + ' sorted</div></div>' +
      '<span class="tp-chev ' + (state.bookingsOpen ? 'open' : '') + '">⌄</span></button>' +
      (state.bookingsOpen ? '<div class="tp-panel-body">' + rows + '</div>' : '') + '</div>';
  }

  function partyFor(a) { return a.partyOverride || PARTY[a.locKey] || []; }
  function perPersonGbp(a) { var p = partyFor(a); if (a.totalGbp == null || !p.length) return null; return a.totalGbp / p.length; }
  function perPersonThb(a) {
    var p = partyFor(a); if (!p.length) return null;
    if (a.totalThb != null) return a.totalThb / p.length;
    var pg = perPersonGbp(a); return pg == null ? null : Math.round((pg * THB_RATE) / 10) * 10;
  }
  function airbnbPriceLine(a) {
    var pg = perPersonGbp(a); if (pg == null) return 'Total price not added yet';
    return fmtGBP(pg) + 'pp · ' + (a.totalThb != null ? '' : '≈') + '฿' + fmtTHBNum(perPersonThb(a)) + 'pp';
  }
  function isPaid(a, name) { return name === a.bookedBy ? true : !!(a.paid && a.paid[name]); }

  function renderAirbnbs() {
    var stubs = state.airbnbs.map(function (a) {
      var badge = a.status === 'confirmed' ? '<span class="tp-badge" style="background:#6FBF8C;">Booked</span>' : '<span class="tp-badge" style="background:#E8A33D;">Under review</span>';

        '<div><span class="tp-edit-label">Total ฿</span><input class="tp-input" type="number" step="10" min="0" placeholder="auto" data-role="ab-total-thb" data-id="' + a.id + '" value="' + (a.totalThb != null ? a.totalThb : '') + '" /></div>' +

        '<div><span class="tp-edit-label">Status</span><select class="tp-select" data-role="ab-status" data-id="' + a.id + '">' +
        '<option value="confirmed"' + (a.status === 'confirmed' ? ' selected' : '') + '>Booked</option>' +

        '<button class="tp-edit-done" data-action="toggle-edit" data-id="' + a.id + '">Done</button></div>';

      var paidRows = party.map(function (name) {

      }).join('');

      var ratingLinks = ratingAndLinksHtml({ rating: a.rating, ratingCount: a.ratingCount, placeId: a.placeId, place: a.address });

      var bottom = editing ? editPanel : (
        '<div class="tp-stub-dates">' +
        '<div class="tp-stub-datecol"><div class="tp-stub-datelabel">Check-in</div><div class="tp-stub-dateval">' + esc(a.checkin) + '</div></div>' +

        '<div class="tp-item-meta" style="margin-top:0.5rem;"><span class="tp-item-cost">' + esc(airbnbPriceLine(a)) + ' <span style="color:#5f7f7c;">(' + party.length + '-way split)</span></span>' + ratingLinks + '</div>' +
        '<div class="tp-stub-note"' + (a.bookedBy ? '' : ' style="font-style:italic;"') + '>' + (a.bookedBy ? 'Booked by ' + esc(a.bookedBy) : 'Booked by — not noted yet, tap ✎ to add') + '</div>' +
        (a.note ? '<div class="tp-stub-note">' + esc(a.note) + '</div>' : '') +
        '<div style="margin-top:0.5rem;border-top:1px solid rgba(232,163,61,0.1);">' + paidRows + '</div>'
      );

      return '<div class="tp-stub"><div class="tp-stub-top"><div><div class="tp-stub-name">' + esc(a.location) + ' — ' + esc(a.name) + '</div>' +
        (a.host ? '<div class="tp-stub-host">' + esc(a.host) + '</div>' : '') + '</div>' +
        '<div style="display:flex;align-items:center;gap:0.3rem;">' + badge + '<button class="tp-icon-btn" data-action="toggle-edit" data-id="' + a.id + '" aria-label="Edit accommodation">✎</button></div></div>' +
        bottom + '</div>';
    }).join('');

    var known = state.airbnbs.filter(function (a) { return a.totalGbp != null; });
    var totalGbp = known.reduce(function (s, a) { return s + a.totalGbp; }, 0);
    var totalThb = known.reduce(function (s, a) { return s + (a.totalThb != null ? a.totalThb : Math.round((a.totalGbp * THB_RATE) / 10) * 10); }, 0);
    var missing = state.airbnbs.length - known.length;
    var summary = known.length ? '<div class="tp-cost-caption" style="margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid rgba(232,163,61,0.12);">Accommodation booked so far (total): <b style="color:#E8A33D;">' + fmtGBP(totalGbp) + ' · ฿' + fmtTHBNum(totalThb) + '</b>' + (missing ? ' — ' + missing + ' still need' + (missing === 1 ? 's' : '') + ' a total price added.' : '') + '</div>' : '';

    document.getElementById('airbnbPanel').innerHTML =
      '<div class="tp-panel"><button class="tp-panel-head" data-action="toggle-airbnbs">' +
      '<div><div class="tp-panel-title">🏠 Booked accommodation</div><div class="tp-panel-sub">' + state.airbnbs.length + ' stays on the books</div></div>' +
      '<span class="tp-chev ' + (state.airbnbsOpen ? 'open' : '') + '">⌄</span></button>' +
      (state.airbnbsOpen ? '<div class="tp-panel-body">' + stubs + summary + '</div>' : '') + '</div>';
  }

  function renderCostSummary() {
    var byLoc = {}, totalGbp = 0, totalThb = 0;
    LOCATIONS.forEach(function (l) { byLoc[l.id] = { gbp: 0, thb: 0 }; });
    state.items.forEach(function (i) {
      if (i.checked) {
        var g = Number(i.cost) || 0, t = thbFor(i);
        byLoc[i.location].gbp += g; byLoc[i.location].thb += t; totalGbp += g; totalThb += t;
      }
    });
    var chips = LOCATIONS.map(function (l) { return '<div class="tp-cost-chip">' + esc(l.name) + '<br><b>' + fmtGBP(byLoc[l.id].gbp) + '</b> · <b>฿' + fmtTHBNum(byLoc[l.id].thb) + '</b></div>'; }).join('');
    document.getElementById('costPanel').innerHTML =
      '<div class="tp-panel" style="padding:0.9rem;"><div class="tp-panel-title">Cost so far (per person)</div>' +
      '<div class="tp-cost-total">' + fmtGBP(totalGbp) + ' <small>· ฿' + fmtTHBNum(totalThb) + '</small></div>' +
      '<div class="tp-cost-caption">Estimated extras only — excludes flights &amp; accommodation. Rates ≈ £1 = ฿' + THB_RATE + ', so this is roughly how much cash to carry for ticked items.</div>' +
      '<div class="tp-cost-grid">' + chips + '</div></div>';
  }

  function renderLocations() {
    var html = LOCATIONS.map(function (loc) {
      var locItems = state.items.filter(function (i) { return i.location === loc.id; }).sort(function (a, b) { return a.order - b.order; });
      var checkedCount = locItems.filter(function (i) { return i.checked; }).length;
      var open = !!state.expandedLocations[loc.id];
      var draft = draftFor(loc.id);

      var cats = [];
      locItems.forEach(function (i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
      var activeCat = state.categoryFilter[loc.id] || 'All';
      if (activeCat !== 'All' && cats.indexOf(activeCat) === -1) activeCat = 'All';
      var filterBtns = cats.length > 1 ? '<div class="tp-filter-row">' +
        ['All'].concat(cats).map(function (c) {
          var col = c === 'All' ? '#8FB0AC' : (CATEGORY_COLORS[c] || CATEGORY_COLORS.Other);
          return '<button class="tp-filter-btn ' + (activeCat === c ? 'active' : '') + '" style="' + (activeCat === c ? 'background:' + col + ';border-color:' + col + ';' : 'border-color:' + col + ';color:' + col + ';') + '" data-action="filter-category" data-id="' + loc.id + '" data-category="' + esc(c) + '">' + esc(c) + '</button>';
        }).join('') + '</div>' : '';
      var displayItems = activeCat === 'All' ? locItems : locItems.filter(function (i) { return i.category === activeCat; });

      var itemsHtml = displayItems.length === 0 ? '<div class="tp-empty">No plans logged yet — add your first stop below.</div>' : displayItems.map(function (item, idx) {
        var editing = !!state.editOpen[item.id];
        var body;
        if (editing) {
          var catOptions = Object.keys(CATEGORY_COLORS).map(function (c) { return '<option value="' + c + '"' + (item.category === c ? ' selected' : '') + '>' + c + '</option>'; }).join('');
          body = '<div class="tp-edit-panel">' +
            '<div><span class="tp-edit-label">Title</span><input class="tp-input" data-role="edit-title" data-id="' + item.id + '" value="' + esc(item.title) + '" /></div>' +
            '<div><span class="tp-edit-label">Day (optional, e.g. "13 Nov")</span><input class="tp-input" placeholder="Which day is this for?" data-role="edit-day" data-id="' + item.id + '" value="' + esc(item.day || '') + '" /></div>' +
            '<div class="tp-edit-row">' +
            '<div><span class="tp-edit-label">Category</span><select class="tp-select" data-role="edit-category" data-id="' + item.id + '">' + catOptions + '</select></div>' +
            '<div><span class="tp-edit-label">£ pp</span><input class="tp-input" type="number" step="0.5" min="0" data-role="edit-cost" data-id="' + item.id + '" value="' + (item.cost || 0) + '" /></div>' +
            '<div><span class="tp-edit-label">฿ pp</span><input class="tp-input" type="number" step="10" min="0" placeholder="auto" data-role="edit-thb" data-id="' + item.id + '" value="' + (item.thb != null ? item.thb : '') + '" /></div>' +
            '</div>' +
            '<div><span class="tp-edit-label">Location (for map link)</span><input class="tp-input" placeholder="e.g. venue name, area, Thailand" data-role="edit-place" data-id="' + item.id + '" value="' + esc(item.place || '') + '" /></div>' +
            '<div class="tp-edit-row">' +
            '<div><span class="tp-edit-label">Rating (0–5)</span><input class="tp-input" type="number" step="0.1" min="0" max="5" placeholder="e.g. 4.5" data-role="edit-rating" data-id="' + item.id + '" value="' + (item.rating != null ? item.rating : '') + '" /></div>' +
            '<div><span class="tp-edit-label"># Ratings</span><input class="tp-input" type="number" step="1" min="0" placeholder="e.g. 1200" data-role="edit-rating-count" data-id="' + item.id + '" value="' + (item.ratingCount != null ? item.ratingCount : '') + '" /></div>' +
            '</div>' +
            '<div><span class="tp-edit-label">Good for (comma separated)</span><input class="tp-input" placeholder="e.g. Thai food, live music" data-role="edit-tags" data-id="' + item.id + '" value="' + esc((item.tags || []).join(', ')) + '" /></div>' +
            '<div><span class="tp-edit-label">Description</span><input class="tp-input" placeholder="Short description…" data-role="edit-desc" data-id="' + item.id + '" value="' + esc(item.description || '') + '" /></div>' +
            '<div><span class="tp-edit-label">Notes</span><textarea class="tp-notes-box" style="margin-top:0;" placeholder="Add a note…" data-role="edit-notes" data-id="' + item.id + '">' + esc(item.notes || '') + '</textarea></div>' +
            '<button class="tp-edit-done" data-action="toggle-edit" data-id="' + item.id + '">Done</button></div>';
        } else {
          body = (item.day ? '<span class="tp-badge" style="background:#7FB3D9;margin-right:0.3rem;">' + esc(item.day) + '</span>' : '') +
            '<span class="tp-badge" style="background:' + (CATEGORY_COLORS[item.category] || CATEGORY_COLORS.Other) + ';margin-right:0.4rem;">' + esc(item.category) + '</span>' +
            '<span class="tp-item-title ' + (item.checked ? 'checked' : '') + '">' + esc(item.title) + '</span>' +
            (item.description ? '<div class="tp-item-desc">' + esc(item.description) + '</div>' : '') + tagsRowHtml(item.tags) +
            '<div class="tp-item-meta"><span class="tp-item-cost">' + esc(costLine(item)) + '</span>' + ratingAndLinksHtml(item) + reservationBadgeHtml(item) + '</div>';
        }
        return '<div class="tp-item-row"><div class="tp-item-main">' +
          '<button class="tp-check ' + (item.checked ? 'checked' : '') + '" data-action="toggle-item" data-id="' + item.id + '" style="margin-top:0.15rem;" aria-label="Toggle add to trip">' + (item.checked ? '✓' : '') + '</button>' +
          '<div style="flex:1;min-width:0;">' + body + '</div></div>' +
          '<div class="tp-item-actions">' +

          '<button class="tp-icon-btn" ' + (idx === displayItems.length - 1 ? 'disabled' : '') + ' data-action="move-item" data-dir="down" data-id="' + item.id + '" aria-label="Move down">↓</button>' +
          '<button class="tp-icon-btn" data-action="toggle-edit" data-id="' + item.id + '" aria-label="Edit item">✎</button>' +
          '<button class="tp-icon-btn" data-action="delete-item" data-id="' + item.id + '" aria-label="Delete item">🗑</button></div></div>';
      }).join('');

      var addRow = '<div class="tp-add-row">' +
        '<input class="tp-input tp-input-title" placeholder="Add your own item…" data-role="draft-title" data-location="' + loc.id + '" value="' + esc(draft.title) + '" />' +

        '<input class="tp-input tp-input-place" placeholder="Location (for map link, optional)" data-role="draft-place" data-location="' + loc.id + '" value="' + esc(draft.place || '') + '" />' +
        '<button class="tp-btn-add" data-action="add-item" data-location="' + loc.id + '">+ Add</button></div>';

      return '<div class="tp-panel"><button class="tp-panel-head" data-action="toggle-location" data-id="' + loc.id + '">' +
        '<div><div class="tp-panel-title"><span class="tp-leg-num">' + loc.leg + '</span> ' + esc(loc.name) + '</div>' +
        '<div class="tp-panel-sub">' + esc(loc.dates) + ' · <span class="tp-progress">' + checkedCount + '/' + locItems.length + ' added</span></div></div>' +
        '<span class="tp-chev ' + (open ? 'open' : '') + '">⌄</span></button>' +
        (open ? '<div class="tp-panel-body">' + filterBtns + itemsHtml + addRow + '</div>' : '') + '</div>';
    }).join('');
    document.getElementById('locationsPanel').innerHTML = html;
  }

  function renderAll() { renderBookings(); renderAirbnbs(); renderCostSummary(); renderLocations(); }

  // ---------- events (delegated) ----------
  var app = document.getElementById('app');
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action, id = el.dataset.id;
    if (action === 'toggle-item') toggleItem(id);
    else if (action === 'delete-item') deleteItem(id);
    else if (action === 'move-item') moveItem(id, el.dataset.dir);
    else if (action === 'toggle-edit') toggleEdit(id);
    else if (action === 'toggle-booking') toggleBooking(id);
    else if (action === 'toggle-location') toggleLocation(id);
    else if (action === 'toggle-bookings') { state.bookingsOpen = !state.bookingsOpen; renderAll(); }
    else if (action === 'toggle-airbnbs') { state.airbnbsOpen = !state.airbnbsOpen; renderAll(); }
    else if (action === 'add-item') addItem(el.dataset.location);
    else if (action === 'toggle-paid') togglePaid(id, el.dataset.name);
    else if (action === 'toggle-bk-person') toggleBkPerson(id, el.dataset.name);
    else if (action === 'filter-category') { state.categoryFilter[id] = el.dataset.category; renderLocations(); }
    else if (action === 'retry-load') loadState();
  });

  // input events are NOT re-rendered immediately, so typing never loses focus.
  // Field edits are debounced and written straight to Supabase.
  app.addEventListener('input', function (e) {
    var el = e.target, role = el.dataset.role, it, ab;
    if (role === 'draft-title') state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { title: el.value });
    else if (role === 'draft-cost') state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { cost: el.value });
    else if (role === 'draft-place') state.drafts[el.dataset.location] = Object.assign({}, draftFor(el.dataset.location), { place: el.value });
    else if (role === 'edit-title') { it = findItem(el.dataset.id); if (it) { it.title = el.value; scheduleFieldWrite(it.id, 'title', it.title); } }
    else if (role === 'edit-day') { it = findItem(el.dataset.id); if (it) { it.day = el.value; scheduleFieldWrite(it.id, 'day', it.day); } }
    else if (role === 'edit-cost') { it = findItem(el.dataset.id); if (it) { it.cost = el.value === '' ? 0 : (parseFloat(el.value) || 0); scheduleFieldWrite(it.id, 'cost', it.cost); } }
    else if (role === 'edit-thb') { it = findItem(el.dataset.id); if (it) { it.thb = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleFieldWrite(it.id, 'thb', it.thb); } }
    else if (role === 'edit-place') { it = findItem(el.dataset.id); if (it) { it.place = el.value; scheduleFieldWrite(it.id, 'place', it.place); } }
    else if (role === 'edit-rating') { it = findItem(el.dataset.id); if (it) { it.rating = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleFieldWrite(it.id, 'rating', it.rating); } }
    else if (role === 'edit-rating-count') { it = findItem(el.dataset.id); if (it) { it.ratingCount = el.value === '' ? null : (parseInt(el.value, 10) || 0); scheduleFieldWrite(it.id, 'ratingCount', it.ratingCount); } }
    else if (role === 'edit-tags') { it = findItem(el.dataset.id); if (it) { it.tags = el.value.split(',').map(function (t) { return t.trim(); }).filter(Boolean); scheduleFieldWrite(it.id, 'tags', it.tags); } }
    else if (role === 'edit-desc') { it = findItem(el.dataset.id); if (it) { it.description = el.value; scheduleFieldWrite(it.id, 'description', it.description); } }
    else if (role === 'edit-notes') { it = findItem(el.dataset.id); if (it) { it.notes = el.value; scheduleFieldWrite(it.id, 'notes', it.notes); } }
    else if (role === 'ab-total-gbp') { ab = findAirbnb(el.dataset.id); if (ab) { ab.totalGbp = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleFieldWrite(ab.id, 'totalGbp', ab.totalGbp); } }
    else if (role === 'ab-total-thb') { ab = findAirbnb(el.dataset.id); if (ab) { ab.totalThb = el.value === '' ? null : (parseFloat(el.value) || 0); scheduleFieldWrite(ab.id, 'totalThb', ab.totalThb); } }
    else if (role === 'ab-bookedby') { ab = findAirbnb(el.dataset.id); if (ab) { ab.bookedBy = el.value; scheduleFieldWrite(ab.id, 'bookedBy', ab.bookedBy); } }
    else if (role === 'ab-note') { ab = findAirbnb(el.dataset.id); if (ab) { ab.note = el.value; scheduleFieldWrite(ab.id, 'note', ab.note); } }
    else if (role === 'bk-name') {
      var bkg = state.bookings.find(function (x) { return x.id === el.dataset.id; });
      if (bkg) { bkg.bookedByName = el.value; scheduleFieldWrite(bkg.id, 'bookedByName', bkg.bookedByName); }
    }
  });

  app.addEventListener('change', function (e) {
    var el = e.target, ab, it;
    if (el.dataset.role === 'edit-category') { it = findItem(el.dataset.id); if (it) { it.category = el.value; writeField(it.id, 'category', it.category); } }
    else if (el.dataset.role === 'ab-status') { ab = findAirbnb(el.dataset.id); if (ab) { ab.status = el.value; renderAirbnbs(); writeField(ab.id, 'status', ab.status); } }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.dataset.role && e.target.dataset.role.indexOf('draft-') === 0) addItem(e.target.dataset.location);
  });

  // ---------- init ----------
  // Passcode lock removed for now — app starts directly.
  function initApp() { renderFlightCard(); useCountdownTick(); renderAll(); loadState(); }
  initApp();
})();
</script>
</body>
</html>
