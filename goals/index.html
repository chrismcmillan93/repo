<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals &amp; Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <p class="eyebrow">Goals &amp; Progress</p>
    <h1>A quiet place to track what matters</h1>
  </header>

  <!-- ---------------- sign-in ---------------- -->
  <section id="auth-screen" class="card auth-card">
    <form id="auth-form" class="auth-form">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" name="email" placeholder="you@example.com" autocomplete="email" required>
      <button type="submit" id="auth-submit" class="btn btn-primary">Send magic link</button>
      <p id="auth-error" class="form-error" role="alert" style="display:none;"></p>
    </form>

    <div id="auth-sent" class="auth-sent" style="display:none;">
      <p class="auth-sent-msg">Check your email for a sign-in link — or type the 6-digit code from the same email below.</p>
      <form id="code-form" class="code-form">
        <label for="auth-code">Code</label>
        <input type="text" id="auth-code" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="6">
        <button type="submit" id="code-submit" class="btn btn-primary">Verify code</button>
      </form>
      <button type="button" id="auth-retry" class="btn btn-quiet">Use a different email</button>
    </div>
  </section>

  <!-- ---------------- signed-in shell ---------------- -->
  <div id="app-shell" style="display:none;">
    <header class="app-header">
      <span id="auth-user-email" class="user-email"></span>
      <button type="button" id="logout-btn" class="btn btn-quiet">Sign out</button>
    </header>

    <section class="card">
      <p class="card-eyebrow">Connection check</p>
      <p id="conn-status" class="conn-status">Checking the <code>goals</code> schema…</p>
      <ul id="areas-list" class="areas-list"></ul>
    </section>
  </div>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
