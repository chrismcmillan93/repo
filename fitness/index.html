<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness log</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Sign-in screen. Shown until a session exists. -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <p class="auth-title">Fitness log</p>
    <p class="auth-lede">Enter your email and we'll send a sign-in link — no password needed.</p>

    <form id="authForm" class="auth-form">
      <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail" name="email" autocomplete="email" required></div>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Send sign-in link</button>
      <p class="form-error" id="authError" hidden></p>
    </form>

    <div id="authSent" class="auth-sent" hidden>
      <p class="auth-lede">Check your email for a sign-in link — or enter the 6-digit code from the same email below.</p>
      <form id="codeForm" class="auth-form">
        <div class="field"><label for="authCode">Code</label><input type="text" id="authCode" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
        <button type="submit" class="btn btn-primary btn-block" id="codeSubmit">Verify code</button>
        <p class="form-error" id="codeError" hidden></p>
      </form>
      <button type="button" id="authRetry" class="btn btn-quiet btn-block">Use a different email</button>
    </div>
  </div>
</div>

<div id="appShell" hidden>
  <div class="utility-bar">
    <span class="signed-in-as" id="signedInAs"></span>
    <button type="button" class="signout-btn" id="signOutBtn">Sign out</button>
  </div>

  <main class="app-main" id="app-main">
    <p class="section-note">Loading&hellip;</p>
  </main>

  <nav class="tab-bar">
    <a href="#/today" data-route="today"><span class="tab-icon" aria-hidden="true">●</span>Today</a>
    <a href="#/week" data-route="week"><span class="tab-icon" aria-hidden="true">▤</span>Week</a>
    <a href="#/plan" data-route="plan"><span class="tab-icon" aria-hidden="true">▭</span>Plan</a>
    <a href="#/progress" data-route="progress"><span class="tab-icon" aria-hidden="true">▲</span>Progress</a>
    <a href="#/checkin" data-route="checkin"><span class="tab-icon" aria-hidden="true">✓</span>Check-in</a>
  </nav>
</div>

<div id="toast-host" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
